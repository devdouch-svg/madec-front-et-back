# My Madec — frontend v2 servi à la racine (/).
#
# Déploiement :
#   v2 : dist/ de my-madec-frontend-test-v2 → /var/www/html
#        (v2 est buildé avec base "/" — vite.config.ts)

server {
    listen 8034 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # ── Assets fingerprintés (prioritaire — évite le fallback SPA → text/html) ──
    location ^~ /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SPA v2 ──────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API / uploads (proxy backend) ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://localhost:8000;
    }

    # API docs — localhost only
    location /docs {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openapi.json {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
